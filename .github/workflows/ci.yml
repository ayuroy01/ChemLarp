name: ci

on:
  push:
  pull_request:

jobs:
  cmake:
    name: ${{ matrix.os }} (CMake)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: CLI smoke test
        shell: bash
        run: |
          exe=build/chemlarp; [ -f build/Release/chemlarp.exe ] && exe=build/Release/chemlarp.exe
          [ -f build/chemlarp.exe ] && exe=build/chemlarp.exe
          "$exe" canon 'C1=CC=C(C=C1)/C=C/C(=O)O'
          "$exe" reaction '1 C + 2 O=O -> 1 O=C=O + 2 O'
          "$exe" kinetics data/mechanisms/h2o2.ocm -m adiabatic-v -T 1000 -P 1 -t 1e-3 H2=2 O2=1 AR=7 > kinetics.txt
          head -4 kinetics.txt
          "$exe" kinetics data/mechanisms/h2o2/chem.inp --thermo data/mechanisms/h2o2/therm.dat -T 1000 -t 1e-3 H2=2 O2=1 AR=7 > ck.txt
          "$exe" kinetics data/mechanisms/h2o2.yaml -T 1000 -t 1e-3 H2=2 O2=1 AR=7 > yaml.txt
          grep ignition kinetics.txt ck.txt yaml.txt
          "$exe" embed 'C[C@@H](C(=O)O)N' --sdf ala.sdf
          grep -c "V2000" ala.sdf

      - name: Python binding smoke test
        shell: bash
        run: |
          python -I -c "
          import sys; sys.path.insert(0, 'python'); import chemlarp
          print('loaded', chemlarp.library_path())
          assert chemlarp.canonical('C1=CC=CC=C1')['canonical'] == 'c1ccccc1'
          r = chemlarp.kinetics('data/mechanisms/h2o2.ocm', {'H2': 2, 'O2': 1, 'AR': 7}, 1000, 1e5, t_end=1e-3)
          assert r['ignition_time'] and r['samples'][-1]['T'] > 2500
          print('ok', r['ignition_time'])
          e = chemlarp.embed('C[C@@H](C(=O)O)N')
          assert e['stereo']['centres_ok'] == 1 and e['converged'] and len(e['coordinates']) == 13
          print('embed ok', e['energy_kcal_mol'])
          "

  mingw:
    name: windows-latest (MSYS2 MinGW, Makefile)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build and test
        run: make -j4 all && make test
