name: packages

# Builds and installs every package on each push, so a release only has to attach files that were already
# tested: Python wheels (Linux x86_64/aarch64, macOS arm64/x86_64, Windows x64), the npm package
# (WebAssembly), portable command-line archives, a Homebrew install from the formula, and the native apps
# (macOS .dmg, Windows installer, Android .apk), each run with an engine call through its window. Nothing is
# published: on a tag v*, a draft GitHub release is made with the files and the filled manifests, and
# publishing to PyPI, npm, Homebrew and winget stays a manual step (docs/PACKAGING.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request: a new push cancels a run that is already queued or going,
# so superseded commits do not hold the runners (tags and the default branch are not cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Same version everywhere
        run: python3 scripts/check_packages.py
      - name: Formula syntax and manifest templates
        run: |
          ruby -c release/homebrew/chemlarp.rb
          mkdir -p dist && set +e
          python3 scripts/release_manifests.py --version "$(python3 scripts/check_packages.py --version-only)" --dist dist
          code=$?; set -e
          # 1: checksums left for the release job to fill; anything else is an error.
          test $code -le 1

  wheels:
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: pypa/cibuildwheel@7940a4c0e76eb2030e473a5f864f291f63ee879b  # v2.21.3
        env:
          # The wheel is py3-none-<platform> (ctypes, no extension module): one build per platform serves
          # every Python from 3.10.
          CIBW_BUILD: "cp312-*"
          # Unpinned build tools: the pinned set of cibuildwheel 2.21 includes packaging 24.1, too old for the
          # SPDX licence expression in pyproject.toml (setuptools needs packaging.licenses, packaging >= 24.2).
          CIBW_DEPENDENCY_VERSIONS: latest
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: native
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_COMMAND: python {project}/scripts/wheel_smoke_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021  # v14
        with:
          version: 3.1.56
      - name: Build, test and pack
        run: scripts/build_npm.sh
      - name: Install the tarball elsewhere and use it
        run: |
          mkdir -p /tmp/npmtest && cd /tmp/npmtest && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/build/npm/chemlarp-*.tgz
          node -e "require('chemlarp').load().then(c => { const r = c.canonical('C1=CC=CC=C1'); if (r.canonical !== 'c1ccccc1') process.exit(1); console.log('installed package ok', c.version()); })"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: npm
          path: build/npm/chemlarp-*.tgz

  cli:
    name: cli ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Version
        shell: bash
        run: echo "V=$(python3 scripts/check_packages.py --version-only)" >> "$GITHUB_ENV"
      - name: Build (make)
        if: runner.os != 'Windows'
        run: |
          extra=(); [ "$RUNNER_OS" = Linux ] && extra=("EXTRA_LDFLAGS=-static-libstdc++ -static-libgcc")
          MACOSX_DEPLOYMENT_TARGET=11.0 make -j4 BUILD=build/cli "${extra[@]}" build/cli/chemlarp
          mkdir -p stage && cp build/cli/chemlarp LICENSE README.md stage/
          ./stage/chemlarp canon C1=CC=CC=C1 | grep -qx c1ccccc1
          tar czf "chemlarp-$V-${{ matrix.name }}.tar.gz" -C stage .
      - name: Build (CMake, static MSVC runtime)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -DCHEMLARP_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release --target chemlarp_cli --parallel
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item build/Release/chemlarp.exe, LICENSE, README.md stage/
          $out = & ./stage/chemlarp.exe canon C1=CC=CC=C1
          if ($out.Trim() -ne 'c1ccccc1') { throw "unexpected output: $out" }
          Compress-Archive -Path stage/* -DestinationPath "chemlarp-$env:V-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cli-${{ matrix.name }}
          path: chemlarp-*

  homebrew:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install the formula's HEAD build from a local tap and run its test
        run: |
          brew tap-new --no-git local/chemlarp
          tap="$(brew --repository)/Library/Taps/local/homebrew-chemlarp"
          # The stable url and sha256 are filled at release time; a placeholder version keeps the formula valid.
          sed -e 's/@VERSION@/0.1.0/' -e "s/@SHA256@/$(printf '0%.0s' {1..64})/" release/homebrew/chemlarp.rb > "$tap/Formula/chemlarp.rb"
          brew install --HEAD local/chemlarp/chemlarp
          brew test local/chemlarp/chemlarp

  # The web app (WebAssembly engine and UI), built once for the three native installers.
  web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021  # v14
        with:
          version: 3.1.56
      - run: scripts/build_web.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: web-app
          path: build/web

  installer-macos:
    needs: web-app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: web-app
          path: webapp
      - name: Build ChemLarp.app and the disk image (runs the server self-test)
        run: scripts/build_macos_app.sh webapp build/macos
      - name: Open the app and run an engine call through its window
        run: |
          app=build/macos/ChemLarp.app/Contents/MacOS/ChemLarp
          "$app" --smoke & pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "smoke timed out"; exit 1; fi
          wait $pid
      - name: The disk image mounts and holds the app
        run: |
          dmg=$(ls build/macos/*.dmg)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/chemlarp-dmg
          test -x /tmp/chemlarp-dmg/ChemLarp.app/Contents/MacOS/ChemLarp
          lipo -info /tmp/chemlarp-dmg/ChemLarp.app/Contents/MacOS/ChemLarp
          hdiutil detach /tmp/chemlarp-dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: installer-macos
          path: build/macos/*.dmg

  installer-windows:
    needs: web-app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: web-app
          path: webapp
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64
      - name: Build ChemLarp.exe (WebView2) and the command-line program
        shell: pwsh
        run: |
          $V = python scripts/check_packages.py --version-only
          $comma = ($V.Split('.') + '0') -join ','
          nuget install Microsoft.Web.WebView2 -OutputDirectory build/nuget -NonInteractive | Out-Null
          $wv = (Get-ChildItem build/nuget -Directory -Filter 'Microsoft.Web.WebView2.*' | Select-Object -First 1).FullName + '\build\native'
          New-Item -ItemType Directory -Force build/windows/stage/bin | Out-Null
          python release/windows/make_ico.py release/windows/chemlarp.ico web/icons/icon-192.png
          Set-Content -Encoding ascii build/windows/version.h "#define CHEMLARP_VERSION_COMMA $comma`n#define CHEMLARP_VERSION_STR `"$V`""
          rc /nologo /i build/windows /fo build/windows/app.res release/windows/app.rc
          if ($LASTEXITCODE -ne 0) { throw "rc failed" }
          cl /nologo /O2 /EHsc /std:c++17 /MT /DUNICODE /D_UNICODE /I "$wv\include" release/windows/main.cpp build/windows/app.res `
             /Fobuild/windows/ /Fe:build/windows/stage/ChemLarp.exe /link /SUBSYSTEM:WINDOWS "$wv\x64\WebView2LoaderStatic.lib" `
             user32.lib ole32.lib shell32.lib advapi32.lib version.lib
          if ($LASTEXITCODE -ne 0) { throw "cl failed" }
          Copy-Item -Recurse webapp build/windows/stage/web
          cmake -S . -B build/cmake -DCHEMLARP_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build/cmake --config Release --target chemlarp_cli --parallel
          Copy-Item build/cmake/Release/chemlarp.exe build/windows/stage/bin/chemlarp.exe
          Copy-Item LICENSE build/windows/stage/
          "V=$V" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run an engine call through the window
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build/windows/stage/ChemLarp.exe -ArgumentList '--smoke', "$pwd\smoke.txt" -PassThru -Wait
          Get-Content smoke.txt
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }
      - name: Installer (Inno Setup), installed silently and run from its installed place
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$env:V" "/DStage=$pwd\build\windows\stage" "/DOutDir=$pwd\build\windows" release/windows/chemlarp.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          $setup = Get-ChildItem build/windows/ChemLarp-*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\ChemLarp\ChemLarp.exe"
          if (-not (Test-Path $app)) { throw "not installed at $app" }
          $p = Start-Process -FilePath $app -ArgumentList '--smoke', "$pwd\smoke2.txt" -PassThru -Wait
          Get-Content smoke2.txt
          if ($p.ExitCode -ne 0) { throw "installed app smoke test failed" }
          & "$env:LOCALAPPDATA\Programs\ChemLarp\bin\chemlarp.exe" canon C1=CC=CC=C1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: installer-windows
          path: build/windows/ChemLarp-*-setup.exe

  installer-android:
    needs: web-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: web-app
          path: webapp
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4
        with:
          gradle-version: 8.10.2
      - name: SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build and sign the APK
        run: scripts/build_android.sh webapp build/android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install on an emulator and run an engine call through the app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/android_smoke.sh build/android/ChemLarp-*-android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: installer-android
          path: build/android/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [versions, wheels, npm, cli, homebrew, installer-macos, installer-windows, installer-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Every artifact except the web app (which is inside the installers already).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: npm
          path: dist
      - name: Manifests with checksums
        run: |
          V="${GITHUB_REF_NAME#v}"
          curl -fsSL -o "dist/ChemLarp-$V.tar.gz" "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          python3 scripts/release_manifests.py --version "$V" --dist dist --source-tarball "dist/ChemLarp-$V.tar.gz"
          (cd dist && tar czf manifests.tar.gz manifests && rm -rf manifests && sha256sum * > SHA256SUMS)
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "ChemLarp $GITHUB_REF_NAME" --generate-notes
